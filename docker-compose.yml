services:
  app:
    build:
      context: ./src/
      target: base
    ports:
      - '5001:5001'
    command: go run ./...
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - './src:/go/src'
    env_file: 
      - ./local.env
    init: true
  
  mysql:
    platform: linux/x86_64
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: 'pass'
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-S", "/var/run/mysqld/mysqld.sock", "-u", "root", "-ppass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
